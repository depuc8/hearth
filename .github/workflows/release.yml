name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-binary:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Register compiler problem matcher
        run: echo "::add-matcher::.github/problem-matchers/cxx.json"

      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        # Static libstdc++/libgcc so the binary only needs glibc at runtime.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

      - name: Package
        id: package
        run: |
          name="hearth-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${name}"
          strip build/src/hearth
          cp build/src/hearth README.md LICENSE "dist/${name}/"
          cp -r public "dist/${name}/public"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          generate_release_notes: true
